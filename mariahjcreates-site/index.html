<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mariah J Creates</title>
  <meta name="description" content="UGC creator and boy mom helping women build a quieter life, not a smaller one.">
  <meta property="og:title" content="Mariah J Creates">
  <meta property="og:description" content="UGC creator and boy mom helping women build a quieter life, not a smaller one.">

  <link rel="icon" href="/images/profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/styles.css">

<body data-page="home" class="bg-cream text-ink font-sans min-h-screen flex flex-col">
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-espresso-mist opacity-70 blur-3xl"></div>
    <div class="absolute bottom-0 -left-24 w-80 h-80 rounded-full bg-linen opacity-80 blur-3xl"></div>
  </div>
  <main class="relative mx-auto w-full max-w-md px-5 pt-14 pb-10 flex flex-col items-center text-center fade">
    <div class="w-28 h-28 rounded-full p-1 bg-gradient-to-br from-espresso-soft to-sand shadow-sm">
      <img id="profile-photo" src="/images/profile.jpg" alt="Mariah" class="w-full h-full rounded-full object-cover ring-4 ring-cream">
    </div>
    <h1 id="name" class="mt-5 font-serif text-4xl font-semibold tracking-tight">Mariah</h1>
    <p id="handle" class="mt-1 text-sm text-espresso font-medium tracking-wide"></p>
    <p id="bio" class="mt-4 max-w-xs text-[15px] leading-relaxed text-muted"></p>
    <nav id="socials" aria-label="Social media" class="mt-6 flex items-center gap-3"></nav>
    <section id="links" aria-label="Links" class="mt-9 w-full flex flex-col gap-4"></section>
    <footer class="mt-12 text-xs text-muted">
      <p id="tagline" class="font-serif italic text-base text-espresso"></p>
      <p class="mt-2">&copy; Mariah J Creates</p>
    </footer>
  </main>
  <script src="/assets/site.js"></script>

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UGC Portfolio | Mariah J Creates</title>
  <meta name="description" content="UGC videos and lifestyle photos by Mariah, a former corporate marketer and boy mom.">
  <meta property="og:title" content="UGC Portfolio | Mariah J Creates">
  <meta property="og:description" content="UGC videos and lifestyle photos by Mariah, a former corporate marketer and boy mom.">
  <meta property="og:image" content="https://mariahjcreates.com/images/mariah-full.jpg">
  <link rel="icon" href="/images/profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="/assets/styles.css">

<body data-page="portfolio" class="bg-cream text-ink font-sans min-h-screen flex flex-col">
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-espresso-mist opacity-70 blur-3xl"></div>
    <div class="absolute bottom-0 -left-24 w-80 h-80 rounded-full bg-linen opacity-80 blur-3xl"></div>
  </div>
  <header id="site-header" class="relative"></header>
  <main class="relative mx-auto w-full max-w-5xl px-5 py-10 fade">
    <section class="grid md:grid-cols-[1fr_320px] gap-10 items-center">
      <div>
        <p class="text-xs uppercase tracking-[0.2em] text-espresso font-medium">UGC Portfolio</p>
        <h1 id="headline" class="mt-3 font-serif text-4xl md:text-5xl font-semibold leading-tight"></h1>
        <p id="intro" class="mt-5 text-muted leading-relaxed max-w-xl"></p>
        <a id="contact-email" href="#" class="btn-primary mt-7 inline-flex items-center gap-2 rounded-full px-6 py-3 text-sm font-medium">Let's work together <i class="fa-solid fa-arrow-right text-xs"></i></a>
      </div>
      <img src="/images/mariah-full.jpg" alt="Mariah" class="w-full aspect-[4/5] object-cover rounded-3xl">
    </section>
    <h2 class="mt-20 font-serif text-3xl font-semibold">What I create</h2>
    <section id="services" class="mt-6 grid md:grid-cols-3 gap-5"></section>
    <h2 class="mt-20 font-serif text-3xl font-semibold">Recent brand work</h2>
    <section id="projects" class="mt-6 grid sm:grid-cols-2 lg:grid-cols-3 gap-6"></section>
  </main>
  <footer id="site-footer" class="mt-auto border-t border-sand/70"></footer>
  <script src="/assets/site.js"></script>
</body>
</html>

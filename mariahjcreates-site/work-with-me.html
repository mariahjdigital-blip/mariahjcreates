<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Work With Me | Mariah J Creates</title>
  <meta name="description" content="Partner with Mariah on UGC videos, lifestyle photos and Instagram collabs.">
  <meta property="og:title" content="Work With Me | Mariah J Creates">
  <meta property="og:description" content="Partner with Mariah on UGC videos, lifestyle photos and Instagram collabs.">
  <meta property="og:image" content="https://mariahjcreates.com/images/mariah-full.jpg">
  <link rel="icon" href="/images/profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="work" class="bg-cream text-ink font-sans min-h-screen flex flex-col">
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-espresso-mist opacity-70 blur-3xl"></div>
    <div class="absolute bottom-0 -left-24 w-80 h-80 rounded-full bg-linen opacity-80 blur-3xl"></div>
  </div>
  <header id="site-header" class="relative"></header>
  <main class="relative mx-auto w-full max-w-2xl px-5 py-10 fade">
    <p class="text-xs uppercase tracking-[0.2em] text-espresso font-medium">For brands</p>
    <h1 class="mt-3 font-serif text-4xl md:text-5xl font-semibold leading-tight">Let's create something together</h1>
    <p class="mt-4 text-muted leading-relaxed">Tell me a little about your brand and what you have in mind. I'll get back to you within two business days. You can also email me at <a id="work-email" class="text-espresso font-medium underline" href="#"></a>.</p>
    <form id="inquiry" name="brand-inquiry" method="POST" data-netlify="true" netlify-honeypot="company" class="mt-8 rounded-2xl border border-sand bg-white/70 p-6 space-y-4">
      <input type="hidden" name="form-name" value="brand-inquiry">
      <p class="hidden"><label>Company <input name="company"></label></p>
      <div class="grid sm:grid-cols-2 gap-4">
        <label class="block text-sm font-medium">Your name<input name="name" required class="field mt-1"></label>
        <label class="block text-sm font-medium">Brand<input name="brand" required class="field mt-1"></label>
      </div>
      <label class="block text-sm font-medium">Email<input name="email" type="email" required class="field mt-1"></label>
      <label class="block text-sm font-medium">What are you looking for?
        <select name="type" class="field mt-1">
          <option>UGC videos</option><option>Lifestyle photos</option><option>Instagram collab</option><option>Something else</option>
        </select>
      </label>
      <label class="block text-sm font-medium">Project details<textarea name="message" rows="5" class="field mt-1"></textarea></label>
      <button type="submit" class="btn-primary w-full rounded-full px-6 py-3 text-sm font-medium">Send inquiry</button>
    </form>
    <div id="inquiry-thanks" class="hidden mt-8 rounded-2xl bg-espresso-mist p-6">
      <p class="font-serif text-2xl font-semibold">Thank you!</p>
      <p class="mt-2 text-sm text-muted">Your message is in. I'll be in touch soon.</p>
    </div>
  </main>
  <footer id="site-footer" class="mt-auto border-t border-sand/70"></footer>
  <script src="/assets/site.js"></script>
</body>
</html>

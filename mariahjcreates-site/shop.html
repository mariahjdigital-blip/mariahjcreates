<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shop My Favorites | Mariah J Creates</title>
  <meta name="description" content="Home, mom life and everyday favorites from Mariah.">
  <meta property="og:title" content="Shop My Favorites | Mariah J Creates">
  <meta property="og:description" content="Home, mom life and everyday favorites from Mariah.">
  <meta property="og:image" content="https://mariahjcreates.com/images/mariah-full.jpg">
  <link rel="icon" href="/images/profile.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="/assets/styles.css">
</head>
<body data-page="shop" class="bg-cream text-ink font-sans min-h-screen flex flex-col">
  <div aria-hidden="true" class="pointer-events-none fixed inset-0 -z-10 overflow-hidden">
    <div class="absolute -top-24 -right-24 w-72 h-72 rounded-full bg-espresso-mist opacity-70 blur-3xl"></div>
    <div class="absolute bottom-0 -left-24 w-80 h-80 rounded-full bg-linen opacity-80 blur-3xl"></div>
  </div>
  <header id="site-header" class="relative"></header>
  <main class="relative mx-auto w-full max-w-5xl px-5 py-10 fade">
    <p class="text-xs uppercase tracking-[0.2em] text-espresso font-medium">Shop</p>
    <h1 class="mt-3 font-serif text-4xl md:text-5xl font-semibold">My favorites</h1>
    <p id="shop-intro" class="mt-4 text-muted max-w-2xl leading-relaxed text-sm"></p>
    <a id="shopmy" hidden href="#" target="_blank" rel="noopener" class="btn-primary mt-6 inline-flex items-center gap-2 rounded-full px-6 py-3 text-sm font-medium"><i class="fa-solid fa-bag-shopping"></i> Visit my ShopMy</a>
    <div id="shop-filters" class="mt-8 flex flex-wrap gap-2"></div>
    <section id="shop-items" class="mt-6 grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4"></section>
  </main>
  <footer id="site-footer" class="mt-auto border-t border-sand/70"></footer>
  <script src="/assets/site.js"></script>
</body>
</html>
